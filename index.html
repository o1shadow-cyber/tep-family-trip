<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tep Family · Vietnam & Thailand</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F2; --ink:#1D1A17; --muted:#8C8379; --line:#E9E2D8; --card:#FFFFFF;
  --saigon:#C0573A; --hanoi:#2F7F68; --phuket:#16798A; --bangkok:#B5852A; --travel:#6E655C;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.wrap{max-width:720px;margin:0 auto;padding:0 24px}

/* HERO */
.hero{padding:56px 0 0}
.kicker{font:600 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hero h1{font:300 54px/1.02 var(--serif);letter-spacing:-.02em;margin:18px 0 0}
.hero h1 em{display:inline-block;font-style:italic;font-size:.5em;color:var(--muted);margin-bottom:10px;letter-spacing:0}
.dates{font:400 17px/1.4 var(--serif);margin-top:18px}
.route{position:relative;height:66px;margin:36px 4px 0 4px}
.route b{position:absolute;left:0;right:0;top:4px;height:1px;background:var(--line)}
.route span{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;font:500 12px/1.3 var(--sans);color:var(--muted);white-space:nowrap}
.route span:first-of-type{transform:none;align-items:flex-start;text-align:left;margin-left:-4px}
.route span:last-of-type{transform:translateX(-100%);align-items:flex-end;text-align:right;margin-left:4px}
.route i{width:9px;height:9px;border-radius:50%;background:var(--c);margin-bottom:10px}
.count{display:inline-block;margin-top:18px;font:500 12px/1 var(--sans);letter-spacing:.04em;padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:#fff}
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:40px;height:46vh;min-height:260px;max-height:420px}
.mosaic a{position:relative;overflow:hidden}
.mosaic a::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--c)}

/* NAV */
nav{position:sticky;top:0;z-index:10;background:rgba(250,247,242,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding-top:0;padding-bottom:0}
nav .wrap::-webkit-scrollbar{display:none}
nav a{flex:none;font:500 13px/1 var(--sans);color:var(--muted);padding:18px 0 16px;border-bottom:2px solid transparent}
nav a.on{color:var(--ink);border-color:var(--c,var(--ink))}

/* CHAPTER */
.chapter{padding-top:72px}
.cover{position:relative;height:62vh;min-height:380px;max-height:560px;overflow:hidden}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.62))}
.cover .t{position:absolute;left:0;right:0;bottom:0;z-index:2;color:#fff;padding:0 24px 26px;max-width:720px;margin:0 auto}
.cover .n{font:500 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.cover h2{font:300 46px/1 var(--serif);letter-spacing:-.02em;margin-top:10px}
.cover .d{font:400 15px/1 var(--serif);margin-top:10px;opacity:.92}
.cover .bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--c);z-index:3}

.stay{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}
.stay small{display:block;font:600 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.stay strong{font:400 19px/1.25 var(--serif)}
.stay .when{font-size:13px;color:var(--muted);margin-top:3px}

.day{display:grid;grid-template-columns:50px 1fr;gap:0 12px;padding:34px 0;border-bottom:1px solid var(--line)}
.day .num{font:300 44px/.9 var(--serif);color:var(--c)}
.day .wd{font:600 10px/1.35 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.day h3{font:400 23px/1.2 var(--serif);letter-spacing:-.01em;margin-top:-2px}
.day.opt .num{font-size:20px;line-height:1.1;font-style:italic}
.day.today{background:linear-gradient(90deg,transparent,rgba(0,0,0,.02))}
.tag{display:inline-block;font:600 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin-bottom:8px}
.items{list-style:none;margin-top:16px}
.items li{padding:12px 0;border-top:1px dashed var(--line)}
.items li:first-child{border-top:0;padding-top:4px}
.row{display:flex;gap:12px;align-items:baseline}
.time{flex:none;width:62px;font:500 12px/1.4 var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.what{font:500 15px/1.4 var(--sans)}
.pick{font:600 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--c);padding:4px 7px;border-radius:4px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.btn.bkd{color:#2F7F68;border-color:#2F7F68;font-weight:600;padding:8px 8px 8px 5px;gap:4px}
.btn.bkd .bk{font:700 8.5px/1 var(--sans);letter-spacing:.02em;text-transform:uppercase;color:#fff;background:#2F7F68;padding:3px 4px;margin:-3px 0;border-radius:99px}
.pick.alt{background:transparent;color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.note{font-size:13px;color:var(--muted);margin:3px 0 0 74px;line-height:1.45}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0 74px}
.btn{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--sans);padding:8px 11px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--c,var(--ink))}
.btn.go{background:var(--ink);border-color:var(--ink);color:#fff}
.btn svg{width:12px;height:12px;flex:none}
.eta{display:inline-flex;align-items:center;gap:5px;font:500 11px/1 var(--sans);color:var(--muted);padding:8px 2px}
.eta svg{width:12px;height:12px}

/* SECTION HEAD */
.sec{padding-top:96px}
.sec h2{font:300 40px/1.05 var(--serif);letter-spacing:-.02em}
.sec .sub{color:var(--muted);margin-top:10px;font-size:14px}

/* PASSES */
.group{font:600 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:40px 0 14px}
.pass{position:relative;background:var(--card);border-radius:18px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(40,30,20,.25);margin-bottom:14px;overflow:hidden}
.pass .top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 0;font:500 12px/1 var(--sans);color:var(--muted)}
.pass .fn{font:600 12px/1 var(--sans);letter-spacing:.08em;color:var(--ink)}
.pass .legs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;padding:16px 20px 18px}
.pass .city{font:400 25px/1.05 var(--serif);letter-spacing:-.01em}
.pass .hm{font:500 13px/1 var(--sans);color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.pass .r{text-align:right}
.pass .plane{color:var(--c);padding-bottom:22px}
.pass .plane svg{width:22px;height:22px}
.pass .stub{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-top:1.5px dashed var(--line);position:relative}
.pass .stub::before,.pass .stub::after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
.pass .stub::before{left:-10px}.pass .stub::after{right:-10px}
.who{font:600 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.pass .edge{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}

/* STAYS */
.hotels{margin-top:30px}
.hotel{display:grid;grid-template-columns:6px 1fr;gap:0 18px;padding:22px 0;border-bottom:1px solid var(--line)}
.hotel .sw{background:var(--c);border-radius:3px}
.hotel strong{font:400 21px/1.2 var(--serif)}
.hotel .when{font-size:13px;color:var(--muted);margin-top:4px}
.hotel .acts{margin:12px 0 0}

/* NOTES */
.check{list-style:none;margin-top:28px}
.check li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:18px 0;border-bottom:1px solid var(--line);align-items:start}
.check label{display:contents;cursor:pointer}
.check input{appearance:none;width:22px;height:22px;border:1.5px solid #CFC6BA;border-radius:6px;margin-top:1px;cursor:pointer;display:grid;place-items:center}
.check input:checked{background:var(--ink);border-color:var(--ink)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check .tx{font-size:15px}
.check .acts{margin:10px 0 0}

/* KIDS */
#kids{--k:var(--saigon)}
.players{display:flex;gap:8px;margin-top:26px}
.player{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font:600 16px/1.1 var(--sans);color:var(--ink);min-height:96px}
.player small{font:500 12px/1 var(--sans);color:var(--muted)}
.player .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:400 20px/1 var(--serif);color:#fff;background:var(--pc)}
.player[aria-pressed="true"]{border:2px solid var(--ink);box-shadow:0 8px 20px -14px rgba(0,0,0,.5)}
.score{margin-top:16px;background:var(--ink);color:#fff;border-radius:22px;padding:22px 22px 20px}
.score .top{display:flex;justify-content:space-between;align-items:flex-end}
.score .pts{font:300 54px/0.9 var(--serif)}
.score .pts small{font:500 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-left:6px}
.score .tier{text-align:right}
.score .tier b{display:block;font:400 22px/1 var(--serif);margin-bottom:4px}
.score .tier span{font:500 12px/1.4 var(--sans);opacity:.65}
.meter{height:8px;border-radius:9px;background:rgba(255,255,255,.14);margin-top:18px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--saigon),var(--hanoi),var(--phuket),var(--bangkok));transition:width .4s}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.stamp{aspect-ratio:1;display:grid;place-items:center;border-radius:50%}
.stamp svg{width:100%;height:100%}
.stamp.off{opacity:.45}
.stamp.on{background:#FAF7F2}
.stamp.on svg{transform:rotate(-12deg)}
.cities{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:26px}
.cities::-webkit-scrollbar{display:none}
.cbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 2px;border-radius:16px;min-width:0;border:1.5px solid var(--line);background:#fff;font:600 15px/1 var(--sans);color:var(--ink);cursor:pointer;min-height:60px}
.cbtn .ct{font:500 13px/1 var(--sans);color:var(--muted)}
.cbtn[aria-pressed="true"]{background:var(--cc);border-color:var(--cc);color:#fff}
.cbtn[aria-pressed="true"] .ct{color:rgba(255,255,255,.85)}
.hunt-h{display:flex;justify-content:space-between;align-items:baseline;margin:30px 0 4px;gap:10px}
.hunt-h h3{font:400 26px/1.1 var(--serif);color:var(--kt)}
.hunt-h span{font:600 13px/1 var(--sans);color:var(--muted);white-space:nowrap}
.lbl{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.find{background:#fff;border-radius:18px;border:1.5px solid var(--line);margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.find.done{border-color:var(--k)}
.find .main{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:16px 16px 10px;cursor:pointer;color:var(--ink);font:inherit;min-height:72px}
.tick{width:40px;height:40px;border-radius:50%;border:2px solid #D6CCBF;display:grid;place-items:center;transition:.2s}
.tick svg{width:20px;height:20px;opacity:0}
.find.done .tick{background:var(--k);border-color:var(--k)}
.find.done .tick svg{opacity:1}
.find .t1{font:600 17px/1.3 var(--sans)}
.find .t2{font:500 13px/1.3 var(--sans);color:var(--muted);margin-top:4px}
.plus{font:700 14px/1 var(--sans);color:var(--kt);white-space:nowrap}
.find.done .plus{color:var(--muted);font-weight:600}
.reveal{display:inline-flex;align-items:center;gap:6px;margin:0 16px 14px 70px;padding:10px 14px;border-radius:99px;border:1.5px dashed var(--k);background:transparent;color:var(--kt);font:600 14px/1 var(--sans);cursor:pointer;min-height:44px}
.reveal svg{width:16px;height:16px}
.fact{display:none;margin:0 16px 16px 70px;font:400 17px/1.5 var(--serif);color:var(--ink)}
.fact .x{display:block;font:400 14px/1.5 var(--sans);color:var(--muted);margin-top:6px}
.find.open .fact{display:block}
.find.open .reveal{display:none}
.say{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.word{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);min-height:124px;display:flex;flex-direction:column}
.word b{font:400 24px/1.1 var(--serif)}
.word .pr{font:600 15px/1.3 var(--sans);color:var(--kt);white-space:nowrap;margin-top:6px}
.word .mn{font:500 14px/1.3 var(--sans);color:var(--muted);margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.word.done{border-color:var(--k);background:color-mix(in srgb,var(--k) 8%,#fff)}
.word .mini{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid #D6CCBF;display:grid;place-items:center}
.word.done .mini{background:var(--k);border-color:var(--k)}
.word .mini svg{width:13px;height:13px;opacity:0}.word.done .mini svg{opacity:1}
.chal{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:20px;border-radius:20px;border:2px dashed var(--k);background:transparent;cursor:pointer;font:inherit;color:var(--ink)}
.chal .t1{font:400 20px/1.3 var(--serif)}
.chal .t2{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--kt);margin-bottom:8px}
.chal.done{border-style:solid;border-color:var(--k);background:var(--k);color:#fff}
.chal.done .t2{color:rgba(255,255,255,.8)}
.chal .tick{border-color:var(--k)}
.chal.done .tick{background:#fff;border-color:#fff}.chal.done .tick svg{opacity:1}.chal.done .tick svg path{stroke:var(--k)}
.kidnote{font-size:13px;color:var(--muted);margin-top:22px;line-height:1.5}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:10px 0;min-height:44px}

/* PHOTOS */
.addph{display:inline-flex;align-items:center;gap:7px;font:600 12px/1 var(--sans);letter-spacing:.02em;padding:9px 14px;border-radius:99px;background:var(--ink);color:#fff;border:1px solid var(--ink);min-height:36px;vertical-align:top}
.addph svg{width:15px;height:15px;flex:none}
.hero-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:18px}
.hero-acts .count{margin-top:0}
.cover .addph{position:absolute;top:16px;right:16px;z-index:4;background:rgba(255,255,255,.92);color:var(--ink);border-color:transparent;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ph-hero{margin-top:26px;border-radius:24px;background:var(--ink);color:#fff;padding:28px 22px 22px;position:relative;overflow:hidden}
.ph-hero .strip{display:flex;gap:6px;margin-bottom:22px}
.ph-hero .strip i{flex:1;height:6px;border-radius:9px}
.ph-hero p{font:400 21px/1.35 var(--serif)}
.ph-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;margin-top:22px;border-radius:16px;background:#fff;color:var(--ink);font:600 17px/1 var(--sans)}
.ph-btn svg{width:22px;height:22px}
.ph-btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:10px;border-radius:16px;border:1px solid rgba(255,255,255,.28);color:#fff;font:500 15px/1 var(--sans)}
.ph-btn2 svg{width:14px;height:14px}
.steps{list-style:none;margin-top:28px;counter-reset:st}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);font:400 17px/1.35 var(--sans)}
.steps li:last-child{border-bottom:1px solid var(--line)}
.steps li::before{counter-increment:st;content:counter(st);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:400 21px/1 var(--serif);border:1.5px solid var(--line);background:#fff}
.steps .plusi{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);vertical-align:-6px;margin:0 2px}
.steps .plusi svg{width:12px;height:12px}
.ph-note{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.5}
footer.wrap{margin-top:110px;padding:40px 0 60px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}
footer h4{font:600 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px;color:var(--ink)}
footer a{text-decoration:underline;text-underline-offset:2px}

/* DESKTOP */
@media (min-width:900px){
  .hero{display:grid;grid-template-columns:1fr 1.05fr;gap:64px;align-items:center;max-width:1200px;margin:0 auto;padding:56px 40px 0;min-height:calc(100vh - 56px)}
  .hero>.wrap{padding:0;max-width:none;margin:0}
  .hero h1{font-size:76px}
  .mosaic{grid-template-columns:1fr 1fr;height:600px;max-height:72vh;margin:0;gap:6px}
  .mosaic a{border-radius:4px}
  .cover{max-height:620px}
  .cover h2{font-size:72px}
  .sec h2{font-size:56px}
  .day{grid-template-columns:90px 1fr}
  .day .num{font-size:60px}
  .passes{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .wide{max-width:1040px}
}

/* FOOD */
.eatpill{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:8px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.eatpill svg{width:12px;height:12px}
.fgroup{margin-top:40px;scroll-margin-top:64px}
.fhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--c)}
.fhead strong{font:400 21px/1.2 var(--serif)}
.fhead span{font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--c);white-space:nowrap}
.fhotel{font:600 10px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 2px}
.place{padding:16px 0;border-bottom:1px solid var(--line)}
.place .pt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.place b{font:500 16px/1.3 var(--sans)}
.place .walk{flex:none;font:500 12px/1 var(--sans);color:var(--c)}
.place .cu{font-size:13px;color:var(--muted);margin-top:3px}
.place .tag{display:inline-block;font:600 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:3px 7px;margin-right:6px;vertical-align:1px}
.place .why{font-size:14px;margin-top:6px;line-height:1.45}
.place .gr{display:inline-flex;align-items:center;gap:4px;font:500 11px/1 var(--sans);color:var(--muted);margin-top:8px}
.place .gr i{font-style:normal;color:#E0A100}
.place .acts{margin:10px 0 0}
.fnote{font-size:13px;color:var(--muted);margin-top:12px}

// Emma's Bangkok challenge answer source: Guinness lists Bangkok's full ceremonial name as the world's longest place name.
const P={spot:10,word:5,ch:25};
const TIERS=[["Explorer",0],["Navigator",150],["Legend",300]];
const KEY="tepHunt.v1";
let st; try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){st={}}
st.kid=st.kid||"jamison"; st.city=st.city||"saigon"; st.f=st.f||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const has=(k,id)=>!!(st.f[k]&&st.f[k][id]);
const tog=(k,id)=>{st.f[k]=st.f[k]||{}; st.f[k][id]?delete st.f[k][id]:st.f[k][id]=1; save();};
const ck='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#fff"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const eye='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>';
function stampSVG(c,on){const id="sp"+c.id;
 if(!on)return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 4"/><text x="50" y="50" text-anchor="middle" font-family="Inter,sans-serif" font-size="15" font-weight="700" fill="#fff">${c.name}</text><text x="50" y="68" text-anchor="middle" font-family="Inter,sans-serif" font-size="12.5" font-weight="500" fill="#fff">${c.spots.length} to find</text></svg>`;
 return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><path id="${id}" d="M50 50 m-35 0 a35 35 0 1 1 70 0 a35 35 0 1 1 -70 0"/></defs>
 <circle cx="50" cy="50" r="46" fill="none" stroke="${c.hex}" stroke-width="3"/><circle cx="50" cy="50" r="25" fill="none" stroke="${c.hex}" stroke-width="1.5"/>
 <text font-family="Inter,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6" fill="${c.hex}"><textPath href="#${id}" textLength="214">${c.name.toUpperCase()} · ${c.dates} ·</textPath></text>
 <path d="M39 51l7.5 7.5L62 43" fill="none" stroke="${c.hex}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function score(k){let p=0;HUNT.forEach(c=>{c.spots.forEach((_,i)=>{if(has(k,c.id+"s"+i))p+=P.spot});if(has(k,c.id+"ch"))p+=P.ch});
 [["vn",VN],["th",TH]].forEach(([n,a])=>a.forEach((_,i)=>{if(has(k,n+i))p+=P.word}));return p;}
const found=(k,c)=>c.spots.filter((_,i)=>has(k,c.id+"s"+i)).length;
const open={};
function render(){
 const root=document.getElementById("kids"); if(!root)return;
 const kid=KIDS.find(x=>x.id===st.kid), k=kid.id, c=HUNT.find(x=>x.id===st.city);
 const pts=score(k); let ti=0; TIERS.forEach((t,i)=>{if(pts>=t[1])ti=i});
 const nxt=TIERS[ti+1], pct=nxt?Math.round((pts-TIERS[ti][1])/(nxt[1]-TIERS[ti][1])*100):100;
 const sayKey=c.say===VN?"vn":"th";
 root.style.setProperty("--k",c.c); root.style.setProperty("--kt",c.id==="bangkok"?"#8A6416":c.c);
 root.innerHTML=`<div class="kicker">For Jamison, Avery & Emma</div><h2 style="margin-top:14px">Treasure Hunt</h2>

 <div class="score"><div class="top"><div class="pts">${pts}<small>points</small></div><div class="tier"><b>${TIERS[ti][0]}</b><span>${nxt?`${nxt[1]-pts} to ${nxt[0]}`:"Top rank reached"}</span></div></div>

 ${c.spots.map((s,i)=>{const id=c.id+"s"+i,d=has(k,id),o=open[k+id];return `<div class="find ${d?'done':''} ${o?'open':''}">

  <button class="reveal" data-o="${id}">${eye}Reveal fact</button>
  <div class="fact">${kid.lvl===0?s.s:s.f}${kid.lvl===2?`<span class="x">${s.x}</span>`:''}</div></div>`}).join("")}
 <div class="lbl">Say it · ${P.word} points each</div>
 <div class="say">${c.say.map((w,i)=>{const id=sayKey+i,d=has(k,id);return `<button class="word ${d?'done':''}" data-t="${id}" aria-pressed="${d}"><b>${w[0]}</b><span class="pr">“${w[1]}”</span><span class="mn">${w[2]}<span class="mini">${ck}</span></span></button>`}).join("")}</div>
 ${c.say===TH?`<p class="kidnote" style="margin-top:10px">${TH[0][3]}</p>`:''}
 <div class="lbl">${kid.name}’s challenge · ${P.ch} points</div>
 ${(()=>{const id=c.id+"ch",d=has(k,id);return `<button class="chal ${d?'done':''}" data-t="${id}" aria-pressed="${d}"><span><span class="t2" style="display:block">${c.name} challenge</span><span class="t1">${c.ch[kid.lvl]}</span></span><span class="tick">${ck}</span></button>`})()}
 <p class="kidnote">Ranks: Explorer, then Navigator at ${TIERS[1][1]}, then Legend at ${TIERS[2][1]}. Find every spot in a city to stamp the passport. Progress is saved on this phone only. <button class="reset" data-reset>Start ${kid.name} over</button></p>`;
}
document.addEventListener("click",e=>{
 const b=e.target.closest("#kids button"); if(!b)return;
 if(b.dataset.kid)st.kid=b.dataset.kid;
 else if(b.dataset.city)st.city=b.dataset.city;
 else if(b.dataset.t)tog(st.kid,b.dataset.t);
 else if(b.dataset.o)open[st.kid+b.dataset.o]=1;
 else if(b.hasAttribute("data-reset")){if(confirm("Clear all of "+st.kid[0].toUpperCase()+st.kid.slice(1)+"’s finds?")){delete st.f[st.kid]}}
 save(); render();
});
render();
})();

</script>

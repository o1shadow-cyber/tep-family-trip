<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnam and Thailand Trip 2026</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F2; --ink:#1D1A17; --muted:#8C8379; --quiet:#6F675E; --line:#E7E0D6; --card:#FFFFFF;
  --saigon:#C0573A; --hanoi:#2F7F68; --phuket:#16798A; --bangkok:#B5852A;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:48px}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 28px}
.hero{padding:18px 0 4px}
.kicker{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hero h1{font:400 32px/1.05 var(--serif);letter-spacing:-.02em;margin:10px 0 0}
.sub{color:var(--muted);margin-top:8px;font-size:13px}
.sub a{text-decoration:underline;text-underline-offset:2px}
nav{position:sticky;top:0;z-index:10;background:rgba(250,247,242,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding-top:0;padding-bottom:0}
nav .wrap::-webkit-scrollbar{display:none}
nav a{flex:none;display:flex;align-items:center;min-height:44px;font:500 13px/1 var(--sans);color:var(--muted);border-bottom:2px solid transparent}
nav a.on{color:var(--ink);border-color:var(--c,var(--ink))}
.city{padding-top:18px;scroll-margin-top:48px}
.fhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:8px}
.fhead strong{font:400 28px/1 var(--serif);letter-spacing:-.02em}
.fhead span{font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.group{margin-top:22px}
.group:first-child{margin-top:6px}
.ghead h3{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ghead h3::before{content:"";display:block;width:22px;height:2px;border-radius:2px;background:var(--c);margin-bottom:8px}
.ghead p{margin-top:4px;font:400 13px/1.35 var(--serif);color:var(--quiet)}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.place{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 0}
.hit{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.name{display:block;font:500 18px/1.2 var(--serif);letter-spacing:-.01em}
.meta{display:block;margin-top:4px;font:500 12px/1.35 var(--sans);color:var(--muted)}
.meta i{font-style:normal;color:#C4A15A}
.note{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-top:5px;font:400 13px/1.4 var(--sans);color:var(--quiet);white-space:normal}
.place.open .note{display:block;-webkit-line-clamp:unset;overflow:visible}
.extra{display:none;margin-top:6px;font:400 12.5px/1.4 var(--sans);color:var(--muted)}
.place.open .extra{display:block}
.tag{display:inline-block;margin-right:6px;font:600 9px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);border-radius:99px;padding:3px 6px;vertical-align:1px}
.acts{display:flex;flex-wrap:wrap;align-items:center;margin:0 0 0 -2px}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:4px 8px 6px 2px;background:none;border:0}
.btn span{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border:1px solid #E4DCD2;border-radius:99px;background:#FBF9F6;font:500 12px/1 var(--sans);color:var(--ink)}
.btn svg{width:12px;height:12px;color:var(--c)}
.btn:focus-visible span,.hit:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.fnote{margin-top:8px;font:400 12.5px/1.4 var(--serif);color:var(--muted)}
@media (min-width:800px){
  .wrap{padding:0 28px 40px}
  .hero{padding-top:32px}
  .hero h1{font-size:52px}
  .fhead strong{font-size:40px}
  .list{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .fnote{grid-column:1 / -1;margin-top:0}
}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="kicker">Eat nearby</div>
  <h1>Vietnam and Thailand Trip 2026</h1>
  <p class="sub">Google ratings as of Nov 2026. <a href="index.html#food">Trip page</a></p>
</div></header>
<nav><div class="wrap" id="tabs"></div></nav>
<main id="board"></main>
<script src="food.js"></script>
<script>
/* Direction origins. Saigon always starts at Fusion: one night at Sherwood. */
const HOTELS = {
  sherwood: {name:"Sherwood Suites", addr:"Sherwood Suites, 192 Nam Ky Khoi Nghia, Ho Chi Minh City"},
  fusion: {name:"Fusion Original Saigon Centre", addr:"Fusion Original Saigon Centre, 65 Le Loi, Ho Chi Minh City"},
  tirant: {name:"Tirant Hotel", addr:"Hanoi Tirant Hotel, 38 Gia Ngu, Hoan Kiem, Hanoi"},
  merlin: {name:"Phuket Marriott Resort & Spa, Merlin Beach", addr:"Phuket Marriott Resort and Spa, Merlin Beach"},
  dt: {name:"DoubleTree by Hilton Bangkok Ploenchit", addr:"DoubleTree by Hilton Bangkok Ploenchit"}
};
const CITY_HOTEL = {saigon:"fusion", hanoi:"tirant", phuket:"merlin", bangkok:"dt"};
const CITY_IN = {saigon:"Ho Chi Minh City", hanoi:"Hanoi", phuket:"Phuket", bangkok:"Bangkok"};
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const isSkip = g => /^skip\b/i.test((g.label || "").trim());
function sectionCopy(group) {
  if (isSkip(group)) return {title:"Skip", sub:""};
  if (!group.label) return {title:"Near the hotel", sub:""};
  if (/^old town\b/i.test(group.label)) return {title:"Old Town food", sub:"One trip · 35–50 min each way"};
  const bits = group.label.split(" · ");
  return {title:bits[0], sub:bits.slice(1).join(" · ")};
}
function originId(city, group) {
  if (city === "saigon") return "fusion";
  if (group.h && HOTELS[group.h]) return group.h;
  return CITY_HOTEL[city];
}
function destination(place, city) {
  if (place.d) return place.d;
  if (place.q) return place.q;
  if (place.map) {
    try {
      const q = new URL(place.map).searchParams.get("query");
      if (q) return q;
    } catch (e) {}
  }
  return place.n + ", " + CITY_IN[city];
}
/* Sherwood Suites list is not shown. Every place on it is in the same
   central pocket as the hotel, about 1.1–2.4 km from Fusion: roughly
   16–30 min on foot and a few minutes by car with no traffic, so a short
   ride rather than an easy walk. None were far enough to drop. Their
   Sherwood walk times are removed; a traffic-free drive minute would be
   a guess, so these rows have no time chip and Directions opens driving. */
const SHERWOOD_TO_FUSION = new Set([
  "Izakaya TOKI",
  "La SIRENA Saigon",
  "Nhà Anh",
  "HOME Saigon",
  "Merci Bakery",
  "Vị Sài Gòn",
  "Pizza 4P’s Hai Bà Trưng",
  "Little HaNoi Egg Coffee"
]);
function tilesGroups(city) {
  if (city.city !== "saigon") return city.hotels;
  const sherwood = city.hotels.find(g => g.h === "sherwood");
  const moved = (sherwood ? sherwood.p : []).filter(p => SHERWOOD_TO_FUSION.has(p.n)).map(p => {
    const copy = Object.assign({}, p);
    delete copy.w;
    return copy;
  });
  return city.hotels.filter(g => g.h !== "sherwood").map(g => {
    if (g.h !== "fusion") return g;
    const have = new Set(g.p.map(p => p.n));
    return Object.assign({}, g, {p: g.p.concat(moved.filter(p => !have.has(p.n)))});
  });
}
const saysWalk = w => /\bwalk/i.test(w || "");
function dirUrl(origin, dest, mode) {
  return "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(origin) +
    "&destination=" + encodeURIComponent(dest) + "&travelmode=" + mode;
}
function noteOf(place) {
  if (!place.y) return "";
  return place.y.replace(" Best for dinner Mon Nov 30 (Sun or Tue also work).", " Sunday or Tuesday dinner works too.");
}
function btn(label, href, kind, extra) {
  const icon = kind === "dir" ? ARROW : "";
  return `<a class="btn ${kind}" href="${esc(href)}" target="_blank" rel="noopener"${extra || ""}><span>${icon}${esc(label)}</span></a>`;
}

const tabs = document.getElementById("tabs");
const board = document.getElementById("board");
tabs.innerHTML = FOOD.map(c => `<a href="#food-${c.city}" style="--c:var(--${c.city})">${esc(c.label)}</a>`).join("") +
  `<a href="index.html">Trip page</a>`;

board.innerHTML = FOOD.map(city => {
  const groups = tilesGroups(city).map(group => {
    const copy = sectionCopy(group);
    const skip = isSkip(group);
    const hotel = HOTELS[originId(city.city, group)];
    const cards = group.p.map(place => {
      const mode = saysWalk(place.w) ? "walking" : "driving";
      const dest = destination(place, city.city);
      let acts = "";
      if (!skip) {
        acts += btn("Directions", dirUrl(hotel.addr, dest, mode), "dir",
          ` data-origin="${esc(hotel.name)}" data-mode="${mode}"`);
      }
      if (place.res) acts += btn("Reserve", place.res, "go");
      else if (place.act && place.map && /reserv/i.test(place.act)) acts += btn("Reserve", place.map, "go");
      const bits = [];
      if (place.r) bits.push(`<i>★</i> ${esc(place.r)}${place.k ? ` · ${esc(place.k)} reviews` : ""}`);
      if (place.w) bits.push(esc(place.w));
      const meta = bits.join(" · ").replace(" · <i>", " <i>");
      const more = [place.t ? `<span class="tag">${esc(place.t)}</span>` : "", place.c ? esc(place.c) : ""].filter(Boolean).join(" ");
      return `<article class="place"><button type="button" class="hit" aria-expanded="false"><span class="name">${esc(place.n)}</span>${meta ? `<span class="meta">${meta}</span>` : ""}${place.y ? `<span class="note">${esc(noteOf(place))}</span>` : ""}${more ? `<span class="extra">${more}</span>` : ""}</button>${acts ? `<div class="acts">${acts}</div>` : ""}</article>`;
    }).join("");
    return `<section class="group"><header class="ghead"><h3>${esc(copy.title)}</h3>${copy.sub ? `<p>${esc(copy.sub)}</p>` : ""}</header><div class="list">${cards}</div>${group.note ? `<p class="fnote">${esc(group.note)}</p>` : ""}</section>`;
  }).join("");
  return `<section class="city wrap" id="food-${city.city}" style="--c:var(--${city.city})"><div class="fhead"><strong>${esc(city.label)}</strong><span>${esc(city.dates)}</span></div>${groups}</section>`;
}).join("");

board.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const hit = e.target.closest(".hit");
  if (!hit) return;
  const place = hit.closest(".place");
  const open = place.classList.toggle("open");
  hit.setAttribute("aria-expanded", open ? "true" : "false");
});

const links = [...document.querySelectorAll("#tabs a[href^='#']")];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
}), {rootMargin:"-40% 0px -50% 0px"});
document.querySelectorAll(".city").forEach(s => io.observe(s));
</script>
</body>
</html>

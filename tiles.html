<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnam and Thailand Trip 2026</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F2; --ink:#1D1A17; --muted:#8C8379; --line:#E9E2D8; --card:#FFFFFF;
  --saigon:#C0573A; --hanoi:#2F7F68; --phuket:#16798A; --bangkok:#B5852A;
  --serif:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:48px}
body{background:var(--paper);color:var(--ink);font:400 15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
.hero{padding:16px 0 2px}
.kicker{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hero h1{font:300 30px/1.05 var(--serif);letter-spacing:-.02em;margin:8px 0 0}
.sub{color:var(--muted);margin-top:6px;font-size:13px}
.sub a{text-decoration:underline;text-underline-offset:2px}
nav{position:sticky;top:0;z-index:10;background:rgba(250,247,242,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding-top:0;padding-bottom:0}
nav .wrap::-webkit-scrollbar{display:none}
nav a{flex:none;display:flex;align-items:center;min-height:44px;font:500 13px/1 var(--sans);color:var(--muted);border-bottom:2px solid transparent}
nav a.on{color:var(--ink);border-color:var(--c,var(--ink))}
.city{padding:14px 0 2px;scroll-margin-top:48px}
.fhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:2px solid var(--c)}
.fhead strong{font:400 26px/1 var(--serif)}
.fhead span{font:600 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--c);white-space:nowrap}
.ghead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin:12px 0 2px}
.ghead strong{font:600 11px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.ghead .from{font:500 11px/1.3 var(--sans);color:var(--muted)}
.gextra{font-size:12px;line-height:1.35;color:var(--muted);margin-top:1px}
.list{display:flex;flex-direction:column}
.place{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"top top" "note acts" "extra extra";column-gap:8px;row-gap:0;align-items:center;padding:1px 0 2px;border-bottom:1px solid var(--line)}
.hit{display:contents}
.top{grid-area:top;display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0;padding-top:2px;text-align:left}
.name{flex:1 1 auto;min-width:0;font:600 14px/1.25 var(--sans);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{flex:0 1 auto;min-width:0;font:500 12px/1.2 var(--sans);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta i{font-style:normal;color:#E0A100}
.when{color:var(--c);margin-left:6px}
.note{grid-area:note;min-width:0;background:none;border:0;padding:0 0 2px;text-align:left;font:400 13px/1.3 var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.note:focus-visible,.btn:focus-visible,nav a:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.place.open .note{white-space:normal}
.acts{grid-area:acts;display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 10px;border-radius:10px;font:600 12px/1 var(--sans);border:1px solid transparent}
.btn.dir{background:var(--ink);color:#fff}
.btn.go{background:#fff;color:var(--ink);border-color:var(--ink)}
.extra{grid-area:extra;display:none;padding:2px 0 6px;font-size:12.5px;line-height:1.4;color:var(--muted)}
.place.open .extra{display:block}
.tag{display:inline-block;font:600 9px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);border-radius:99px;padding:3px 6px;margin:0 6px 0 0;vertical-align:1px}
.fnote{font-size:12px;line-height:1.35;color:var(--muted);margin-top:6px}
@media (min-width:800px){
  .wrap{padding:0 24px}
  .hero{padding-top:28px}
  .hero h1{font-size:48px}
  .list{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
  .place{break-inside:avoid}
}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="kicker">Eat nearby</div>
  <h1>Vietnam and Thailand Trip 2026</h1>
  <p class="sub">Google ratings as of Nov 2026. <a href="index.html#food">Trip page</a></p>
</div></header>
<nav><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="board"></main>
<script src="food.js"></script>
<script>
/* Hotel names and direction origins. Saigon always starts at Fusion:
   the family only sleeps at Sherwood Suites for one night. */
const HOTELS = {
  sherwood: {name:"Sherwood Suites", addr:"Sherwood Suites, 192 Nam Ky Khoi Nghia, Ho Chi Minh City"},
  fusion: {name:"Fusion Original Saigon Centre", addr:"Fusion Original Saigon Centre, 65 Le Loi, Ho Chi Minh City"},
  tirant: {name:"Tirant Hotel", addr:"Hanoi Tirant Hotel, 38 Gia Ngu, Hoan Kiem, Hanoi"},
  merlin: {name:"Phuket Marriott Resort & Spa, Merlin Beach", addr:"Phuket Marriott Resort and Spa, Merlin Beach"},
  dt: {name:"DoubleTree by Hilton Bangkok Ploenchit", addr:"DoubleTree by Hilton Bangkok Ploenchit"}
};
const CITY_HOTEL = {saigon:"fusion", hanoi:"tirant", phuket:"merlin", bangkok:"dt"};
const CITY_IN = {saigon:"Ho Chi Minh City", hanoi:"Hanoi", phuket:"Phuket", bangkok:"Bangkok"};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const groupLabel = g => g.label || (g.h && HOTELS[g.h] ? "From " + HOTELS[g.h].name : "Nearby");
const isSkip = g => /^skip\b/i.test((g.label || "").trim());
function originId(city, group) {
  if (city === "saigon") return "fusion";
  if (group.h && HOTELS[group.h]) return group.h;
  return CITY_HOTEL[city];
}
function destination(place, city) {
  if (place.d) return place.d;
  if (place.q) return place.q;
  if (place.map) {
    try {
      const q = new URL(place.map).searchParams.get("query");
      if (q) return q;
    } catch (e) {}
  }
  return place.n + ", " + CITY_IN[city];
}
const saysWalk = w => /\bwalk/i.test(w || "");
function dirUrl(origin, dest, mode) {
  return "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(origin) +
    "&destination=" + encodeURIComponent(dest) + "&travelmode=" + mode;
}
function btn(label, href, kind, extra) {
  return `<a class="btn ${kind}" href="${esc(href)}" target="_blank" rel="noopener"${extra || ""}>${esc(label)}</a>`;
}

const tabs = document.getElementById("tabs");
const board = document.getElementById("board");
tabs.innerHTML = FOOD.map(c => `<a href="#food-${c.city}" style="--c:var(--${c.city})">${esc(c.label)}</a>`).join("") +
  `<a href="index.html">Trip page</a>`;

board.innerHTML = FOOD.map(city => {
  const groups = city.hotels.map(group => {
    const full = groupLabel(group);
    const bits = full.split(" · ");
    const title = bits[0];
    const extraNote = bits.slice(1).join(" · ");
    const skip = isSkip(group);
    const hotel = HOTELS[originId(city.city, group)];
    const listedHotel = group.h && HOTELS[group.h] ? HOTELS[group.h].name : "";
    const showOrigin = !skip && hotel.name !== listedHotel;
    const cards = group.p.map(place => {
      const mode = saysWalk(place.w) ? "walking" : "driving";
      const dest = destination(place, city.city);
      let acts = "";
      if (!skip) {
        acts += btn("Directions", dirUrl(hotel.addr, dest, mode), "dir",
          ` data-origin="${esc(hotel.name)}" data-mode="${mode}"`);
      }
      if (place.res) acts += btn("Reserve", place.res, "go");
      else if (place.act && place.map && /reserv/i.test(place.act)) acts += btn("Reserve", place.map, "go");
      const meta = [
        place.r ? `<i>★</i> ${esc(place.r)}${place.k ? ` · ${esc(place.k)}` : ""}` : "",
        place.w ? `<span class="when">${esc(place.w)}</span>` : ""
      ].filter(Boolean).join("");
      const note = place.y || "";
      const more = [place.t ? `<span class="tag">${esc(place.t)}</span>` : "", place.c ? esc(place.c) : ""].filter(Boolean).join(" ");
      return `<article class="place"><button type="button" class="hit" aria-expanded="false"><span class="top"><span class="name">${esc(place.n)}</span>${meta ? `<span class="meta">${meta}</span>` : ""}</span>${note ? `<span class="note">${esc(note)}</span>` : `<span class="note"></span>`}${more ? `<span class="extra">${more}</span>` : ""}</button>${acts ? `<span class="acts">${acts}</span>` : ""}</article>`;
    }).join("");
    return `<section class="group"><div class="ghead"><strong>${esc(title)}</strong>${showOrigin ? `<span class="from">Directions from ${esc(hotel.name)}</span>` : ""}</div>${extraNote ? `<p class="gextra">${esc(extraNote)}</p>` : ""}<div class="list">${cards}</div>${group.note ? `<p class="fnote">${esc(group.note)}</p>` : ""}</section>`;
  }).join("");
  return `<section class="city" id="food-${city.city}" style="--c:var(--${city.city})"><div class="fhead"><strong>${esc(city.label)}</strong><span>${esc(city.dates)}</span></div>${groups}</section>`;
}).join("");

board.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const hit = e.target.closest(".hit");
  if (!hit) return;
  const place = hit.closest(".place");
  const open = place.classList.toggle("open");
  hit.setAttribute("aria-expanded", open ? "true" : "false");
});

const links = [...document.querySelectorAll("#tabs a[href^='#']")];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
}), {rootMargin:"-40% 0px -50% 0px"});
document.querySelectorAll(".city").forEach(s => io.observe(s));
</script>
</body>
</html>
